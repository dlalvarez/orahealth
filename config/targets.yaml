targets:
  - target_id: example_standalone
    name: Example Standalone Database
    environment: development
    expected_architecture: standalone
    profile: standalone_basic
    database:
      primary_connection: example_oracle
      mock_inventory:
        status: OPEN
        open_mode: READ WRITE
        role: PRIMARY
        version: "19.0"
        archivelog_mode: ARCHIVELOG
        tablespace_min_free_pct: 18
        fra_used_pct: 42
        invalid_objects_count: 0
        alert_log_excerpt: "No critical internal errors found"
        storage:
          tablespaces:
            - tablespace_name: "SYSTEM"
              total_mb: 1024
              used_mb: 512
              free_mb: 512
              free_pct: 50
              used_pct: 50
              autoextensible: "YES"
            - tablespace_name: USERS
              total_mb: 2048
              used_mb: 1434
              free_mb: 614
              free_pct: 30
              used_pct: 70
              autoextensible: "YES"
          datafiles:
            - file_name: /u01/oradata/ORCL/system01.dbf
              tablespace_name: "SYSTEM"
              bytes_mb: 1024
              current_mb: 1024
              autoextensible: "YES"
              maxbytes_mb: 32768
              max_mb: 32768
              used_of_max_pct: 3.13
              status: "AVAILABLE"
              online_status: "SYSTEM"
            - file_name: /u01/oradata/ORCL/users01.dbf
              tablespace_name: USERS
              bytes_mb: 2048
              current_mb: 2048
              autoextensible: "YES"
              maxbytes_mb: 32768
              max_mb: 32768
              used_of_max_pct: 6.25
              status: "AVAILABLE"
              online_status: "ONLINE"
          tempfiles:
            - tablespace_name: TEMP
              file_name: /u01/oradata/ORCL/temp01.dbf
              bytes_mb: 1024
              status: "AVAILABLE"
              autoextensible: "YES"
              maxbytes_mb: 32768
          temp_usage:
            - tablespace_name: TEMP
              total_mb: 1024
              used_mb: 128
              free_mb: 896
              used_pct: 12.5
              active_temp_segments_count: 1
              active_temp_sessions_count: 1
              source: dba_temp_files+v$tempseg_usage
              calculation_method: active_temp_segments
              note: Uso activo calculado desde segmentos temporales actualmente asignados a sesiones.
              active_usage_available: true
          undo:
            undo_tablespace: UNDOTBS1
            undo_retention: 900
            tablespace_name: UNDOTBS1
            status: "ONLINE"
            total_mb: 2048
            used_mb: 256
            free_mb: 1792
          fra:
            fra_configured: true
            recovery_file_dest: /u01/fra
            recovery_file_dest_size: 50G
            space_limit_mb: 51200
            space_used_mb: 21504
            space_reclaimable_mb: 2048
            used_pct: 42
            reclaimable_pct: 4
        parameters:
          compatible:
            name: compatible
            value: "19.0.0"
            display_value: "19.0.0"
          optimizer_features_enable:
            name: optimizer_features_enable
            value: "19.1.0"
            display_value: "19.1.0"
          db_block_size:
            name: db_block_size
            value: 8192
            display_value: 8192
          open_cursors:
            name: open_cursors
            value: 500
            display_value: 500
          processes:
            name: processes
            value: 500
            display_value: 500
          sessions:
            name: sessions
            value: 776
            display_value: 776
          audit_trail:
            name: audit_trail
            value: DB
            display_value: DB
          remote_login_passwordfile:
            name: remote_login_passwordfile
            value: EXCLUSIVE
            display_value: EXCLUSIVE
          recyclebin:
            name: recyclebin
            value: ON
            display_value: ON
          filesystemio_options:
            name: filesystemio_options
            value: SETALL
            display_value: SETALL
          control_files:
            name: control_files
            value: /u01/control01.ctl, /u02/control02.ctl
            display_value: /u01/control01.ctl, /u02/control02.ctl
        security:
          locked_users: []
          expired_users: []
          default_open_users: []
          default_profile_users: []
          dba_role_users: []
          critical_privilege_users: []
          permissive_failed_login_profiles: []
          unlimited_password_life_profiles: []
          missing_password_verify_profiles: []
          common_accounts_not_locked_or_expired: []
        force_logging: "YES"
        control_file_count: 2
        redo_log_group_count: 3
        min_redo_log_members_per_group: 2
        redo_log_members:
          - group_number: 1
            member_count: 2
          - group_number: 2
            member_count: 2
          - group_number: 3
            member_count: 2
    operating_system:
      platform: linux
      connections:
        - local_oracle
    features:
      diagnostic_pack: false
      awr: false
      sysdba: false
