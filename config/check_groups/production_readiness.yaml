group_id: production_readiness
name: Preparación productiva
description: Checks conservadores de preparación productiva basados en parámetros Oracle estándar sin AWR, ASH ni Diagnostic Pack.
checks:
  - plsql_optimize_level
  - plsql_code_type
  - plsql_debug
  - sql_trace
  - timed_statistics
  - timed_os_statistics
  - result_cache_mode
  - result_cache_max_result
  - result_cache_remote_expiration
  - db_ultra_safe
  - optimizer_capture_sql_plan_baselines
  - optimizer_use_invisible_indexes
