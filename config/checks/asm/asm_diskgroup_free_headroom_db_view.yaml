check_id: asm_diskgroup_free_headroom_db_view
group_id: asm
title: Margen efectivo de diskgroups ASM
description: ASM básico feature-aware evaluado desde la conexión Oracle de la base de datos, sin conexión dedicada ASM/Grid.
severity: WARNING
collector:
  type: asm
  source_view: V$ASM_DISKGROUP_STAT
  label: Margen efectivo de diskgroups ASM
evaluator:
  type: asm
  metric: asm_diskgroup_free_headroom_db_view
  diskgroup_usable_file_warning_pct_policy: asm_diskgroup_usable_file_warning_pct
  diskgroup_usable_file_fail_pct_policy: asm_diskgroup_usable_file_fail_pct
  diskgroup_usable_file_critical_pct_policy: asm_diskgroup_usable_file_critical_pct
  diskgroup_free_warning_pct_policy: asm_diskgroup_free_warning_pct
  diskgroup_free_fail_pct_policy: asm_diskgroup_free_fail_pct
  diskgroup_free_critical_pct_policy: asm_diskgroup_free_critical_pct
applicability:
  requires_feature: asm
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Uno o más diskgroups ASM utilizados por la base no tienen margen efectivo suficiente para crecimiento. El margen debe evaluarse preferentemente con USABLE_FILE_MB, porque refleja la capacidad realmente utilizable considerando la redundancia ASM; cuando este valor no está disponible, el check utiliza FREE_MB como respaldo y lo deja indicado en la evidencia.
  actions:
    - Revisar USABLE_FILE_MB, USABLE_PCT, FREE_MB y REQUIRED_MIRROR_FREE_MB del diskgroup afectado.
    - Confirmar si el margen disponible soporta el crecimiento esperado de datafiles, tempfiles, redo logs, control files y FRA cuando aplique.
    - Revisar los límites MAXSIZE y AUTOEXTEND de los archivos que residen en el diskgroup.
    - Coordinar con DBA y almacenamiento una ampliación controlada del diskgroup cuando el margen sea insuficiente.
    - Evitar basar la decisión únicamente en FREE_MB cuando ASM use redundancia NORMAL o HIGH.
    - No eliminar archivos ni discos manualmente para recuperar espacio.
    - Validar que cualquier expansión conserve la redundancia, failgroups y diseño soportado del diskgroup.
    - Repetir el health check después de la acción.
  validation:
    - Ejecutar nuevamente OraHealthCheck y confirmar que el check ASM queda dentro de umbrales o documentado.
    - Validar en vistas dinámicas permitidas que el estado y la capacidad reflejan el cambio aplicado.
  owner: Mixed
  requires_window: false
  outage_risk: medium
tags: [oracle, asm, feature-aware, conexion_base]
