check_id: asm_diskgroup_usage_db_view
group_id: asm
title: Uso actual de diskgroups ASM desde la base
description: ASM básico feature-aware evaluado desde la conexión Oracle de la base de datos, sin conexión dedicada ASM/Grid.
severity: WARNING
collector:
  type: asm
  source_view: V$ASM_DISKGROUP_STAT
  label: Uso actual de diskgroups ASM desde la base
evaluator:
  type: asm
  metric: asm_diskgroup_usage_db_view
  diskgroup_free_warning_pct_policy: asm_diskgroup_free_warning_pct
  diskgroup_free_fail_pct_policy: asm_diskgroup_free_fail_pct
  diskgroup_free_critical_pct_policy: asm_diskgroup_free_critical_pct
applicability:
  requires_feature: asm
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Uno o más diskgroups ASM utilizados por la base presentan espacio libre por debajo de los umbrales configurados. Si el diskgroup se queda sin espacio, pueden fallar la extensión de datafiles, la creación de archivos Oracle, las operaciones temporales, la generación de redo o procesos internos que requieran crecimiento.
  actions:
    - Identificar en la evidencia el diskgroup afectado y confirmar FREE_MB, FREE_PCT, USABLE_FILE_MB y USABLE_PCT.
    - Validar con el equipo DBA y de almacenamiento el crecimiento actual y esperado de los archivos de la base.
    - Revisar qué archivos Oracle consumen espacio dentro del diskgroup mediante procedimientos soportados.
    - Evaluar ampliar el diskgroup agregando capacidad o discos según el diseño de almacenamiento aprobado.
    - Evaluar liberar espacio únicamente mediante procedimientos Oracle soportados y después de validar que los archivos sean obsoletos o prescindibles.
    - No eliminar manualmente archivos del diskgroup ni manipular discos ASM sin coordinación con DBA/Grid/Storage.
    - Confirmar el estado de los discos y operaciones de rebalance antes y después de cualquier cambio.
    - Volver a ejecutar OraHealthCheck después de la remediación.
  validation:
    - Ejecutar nuevamente OraHealthCheck y confirmar que el check ASM queda dentro de umbrales o documentado.
    - Validar en vistas dinámicas permitidas que el estado y la capacidad reflejan el cambio aplicado.
  owner: Mixed
  requires_window: false
  outage_risk: medium
tags: [oracle, asm, feature-aware, conexion_base]
