check_id: archivelog_generation_recent
group_id: io_redo_archive
title: Generación reciente de archived logs
description: Mide cantidad y volumen de archived logs generados en las últimas 24 horas.
severity: INFO
collector:
  type: io_redo_archive
  label: Generación reciente de archived logs
  source_view: v$archived_log
evaluator:
  type: io_redo_archive
  lookback_hours: 24
  warning_archivelog_mb_24h: 102400
  fail_archivelog_mb_24h: 204800
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Generación reciente de archived logs puede afectar recuperabilidad, capacidad, continuidad operativa o tiempos de respaldo si no se controla según el estándar.
  actions:
    - Revisar la evidencia recolectada y confirmar si corresponde a operación normal, batch planificado o incidente.
    - Validar espacio, retención, configuración Oracle, respaldos RMAN y dependencias de recuperación o bases standby cuando aplique.
    - Coordinar la acción correctiva con DBA, infraestructura y aplicación antes de modificar parámetros o archivos.
    - Ejecutar cambios mediante procedimientos aprobados y evitar borrados manuales de archivos administrados por RMAN/FRA.
    - Repetir el health check y validar alert.log, reportes y evidencia posterior al ajuste.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, io, redo, archive, fra]
