check_id: sga_memory_info
group_id: oracle_resources
title: Información de memoria SGA
description: Recolecta componentes principales de SGA desde v$sgainfo sin imponer tamaños fijos.
severity: INFO
collector:
  type: oracle_resources
  label: Información de memoria SGA
  source_view: v$sgainfo
evaluator:
  type: oracle_resources
  warning_free_pct_min: 1
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: SGA debe dimensionarse según workload, memoria del host y política de administración de memoria.
  actions:
    - Revisar tamaños de buffer cache, shared pool, large pool, java pool, streams pool y memoria libre.
    - Comparar contra estándares internos y comportamiento real de la aplicación.
    - Evitar imponer tamaños globales sin analizar workload y memoria del host.
    - Planificar ventana si se modifican parámetros estáticos de SGA.
    - Validar posteriormente que la instancia arranque correctamente y mantenga memoria libre aceptable.
  owner: DBA
  requires_window: true
  outage_risk: medium
tags: [oracle, recursos]
