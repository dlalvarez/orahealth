check_id: pga_memory_usage_info
group_id: oracle_resources
title: Información de uso de PGA
description: Recolecta métricas básicas de PGA desde v$pgastat sin utilizar componentes licenciados.
severity: INFO
collector:
  type: oracle_resources
  label: Información de uso de PGA
  source_view: v$pgastat
evaluator:
  type: oracle_resources
  warning_cache_hit_percentage_min: 70
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: La presión de PGA puede afectar sorts y hash joins, provocar uso de TEMP y degradar rendimiento.
  actions:
    - Revisar over allocation count, memoria asignada, memoria en uso y cache hit percentage.
    - Correlacionar con consultas, paralelismo y operaciones que derraman a TEMP.
    - Ajustar pga_aggregate_target o workload solo después de validar memoria disponible.
    - Evitar cambios reactivos sin identificar sesiones o procesos responsables.
    - Recolectar nuevamente la evidencia para confirmar mejora de presión de PGA.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, recursos]
