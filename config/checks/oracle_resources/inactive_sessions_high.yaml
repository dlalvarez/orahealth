check_id: inactive_sessions_high
group_id: oracle_resources
title: Sesiones inactivas elevadas
description: Detecta exceso de sesiones inactivas de usuarios no mantenidos por Oracle.
severity: INFO
collector:
  type: oracle_resources
  label: Sesiones inactivas elevadas
  source_view: v$session+dba_users
evaluator:
  type: oracle_resources
  warning_inactive_sessions: 100
  fail_inactive_sessions: 300
  ok_status: INFO
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Un exceso de sesiones inactivas puede consumir procesos, sesiones y memoria, especialmente por pools mal configurados.
  actions:
    - Revisar sesiones agrupadas por usuario, máquina y programa.
    - Validar timeouts, tamaños de pool y posibles sesiones huérfanas.
    - Coordinar ajustes con el equipo de aplicación antes de cerrar sesiones masivamente.
    - Confirmar que usuarios internos de Oracle estén excluidos del hallazgo principal.
    - Medir nuevamente el total de sesiones inactivas después del ajuste.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, recursos]
