check_id: disabled_triggers
group_id: schema_objects
title: Disparadores deshabilitados en esquemas de aplicación
description: Un disparador deshabilitado puede omitir auditoría, reglas de negocio, sincronización o lógica de integridad implementada en base de datos.
severity: WARNING
collector:
  type: oracle_schema_objects
  field: disabled_triggers
  label: Disparadores deshabilitados
  source_view: DBA_TRIGGERS + DBA_USERS
evaluator:
  type: schema_objects
  status_when_found: WARNING
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY]
  requires:
    database_connection: true
remediation:
  summary: Un disparador deshabilitado puede omitir auditoría, reglas de negocio, sincronización o lógica de integridad implementada en base de datos.
  actions:
    - Identificar propietario, disparador, tabla, tipo y evento disparador.
    - Confirmar con el equipo de aplicación si la deshabilitación es intencional y temporal.
    - Revisar despliegues, cargas o mantenimientos que pudieran haber dejado el disparador deshabilitado.
    - Habilitar con ALTER TRIGGER ... ENABLE cuando corresponda y en una ventana segura si afecta procesos activos.
    - Probar el flujo funcional relacionado y verificar que el disparador permanezca ENABLED.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, schema_objects]
