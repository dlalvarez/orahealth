check_id: invalid_objects
group_id: schema_objects
title: Invalid object count is acceptable
severity: WARNING
collector:
  type: inventory
  source: database
  field: invalid_objects_count
evaluator:
  type: threshold
  operator: ">="
  warning: 1
  fail: 20
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY]
  requires:
    database_connection: true
remediation:
  summary: Existen objetos inválidos en esquemas de base de datos; pueden provocar errores en ejecución de paquetes, vistas, triggers o dependencias de aplicación.
  actions:
    - Identificar objetos inválidos por esquema, tipo y dependencia para priorizar componentes de aplicación críticos.
    - Recompilar objetos inválidos con herramientas estándar como UTL_RECOMP o scripts aprobados, preferentemente fuera de horas pico.
    - Revisar errores de compilación persistentes y corregir dependencias faltantes, privilegios o cambios de estructura.
    - Coordinar con el equipo de aplicación antes de modificar código PL/SQL o dependencias funcionales.
    - Validar que no queden objetos inválidos críticos y ejecutar pruebas básicas de la aplicación afectada.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, schema]
