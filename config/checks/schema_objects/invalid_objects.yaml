check_id: invalid_objects
group_id: schema_objects
title: Invalid object count is acceptable
severity: WARNING
collector:
  type: inventory
  source: database
  field: invalid_objects_count
evaluator:
  type: threshold
  operator: >=
  warning: 1
  fail: 20
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY]
  requires:
    database_connection: true
remediation:
  summary: Recompile invalid objects and investigate persistent failures.
  actions: ["Run schema recompilation during an approved window.", "Review invalid object errors."]
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, schema]
