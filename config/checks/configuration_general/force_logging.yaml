check_id: force_logging
group_id: configuration_general
title: FORCE LOGGING según estándar
severity: WARNING
collector:
  type: oracle_metric
  field: force_logging
  label: force_logging
  source_view: v$database
evaluator:
  type: oracle_config
  label: force_logging
  expected_policy: expected_force_logging
  report_status: INFO
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: FORCE LOGGING ayuda a mejorar la recuperabilidad y consistencia ante operaciones que podrían usar NOLOGGING, replicación o configuraciones con bases standby cuando apliquen.
  actions:
    - Confirmar si la base participa o participará en replicación, configuraciones con bases standby o una estrategia estricta de recuperación.
    - Revisar procesos de carga masiva, mantenimiento o ETL que usan NOLOGGING y coordinar el impacto operativo.
    - Evaluar el incremento esperado en generación de redo y capacidad de archive/FRA.
    - Habilitar FORCE LOGGING si el estándar de recuperabilidad lo exige, coordinando con los equipos afectados.
    - Validar el estado con v$database.force_logging después del cambio.
    - Monitorear generación de redo y desempeño de cargas después de habilitarlo.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, configuration]
