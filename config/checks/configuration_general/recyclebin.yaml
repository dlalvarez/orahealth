check_id: recyclebin
group_id: configuration_general
title: Recyclebin según estándar
severity: WARNING
collector:
  type: oracle_parameter
  parameter: recyclebin
evaluator:
  type: oracle_config
  expected_policy: expected_recyclebin
  report_status: INFO
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: La papelera de reciclaje puede conservar objetos eliminados y consumir espacio, pero también permite recuperación lógica rápida ante borrados accidentales.
  actions:
    - Confirmar el estándar de la organización para recyclebin en ambientes productivos y no productivos.
    - Revisar uso actual de recyclebin y objetos acumulados por esquema antes de decidir una acción.
    - Si se decide deshabilitar recyclebin, validar impacto en procedimientos de recuperación lógica y soporte operativo.
    - Purgar objetos solo con aprobación del dueño de datos y después de confirmar que no se requiere recuperación.
    - Ajustar el parámetro según el estándar aprobado, preferentemente mediante control de cambios.
    - Documentar la excepción si la aplicación o el equipo DBA requiere recyclebin activo.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, configuration]
