check_id: redo_log_members_multiplexed
group_id: configuration_general
title: Miembros redo log multiplexados por grupo
severity: WARNING
collector:
  type: oracle_metric
  field: min_redo_log_members_per_group
  label: min_redo_log_members_per_group
  source_view: v$logfile
  include_fields: [redo_log_members]
evaluator:
  type: oracle_config
  label: min_redo_log_members_per_group
  minimum_policy: min_redo_log_members_per_group
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: Tener un solo member por grupo redo aumenta el riesgo ante pérdida o corrupción de un archivo redo, con impacto potencial en disponibilidad y recuperación.
  actions:
    - Revisar miembros actuales con v$logfile y confirmar el estado de cada grupo redo.
    - Agregar al menos un miembro adicional por cada grupo redo que no cumpla el mínimo definido.
    - Distribuir miembros en storage, diskgroup o filesystem diferente cuando sea posible.
    - No borrar members existentes sin validar estado del grupo redo y sin confirmar que la nueva multiplexación funciona correctamente.
    - Validar v$logfile después del cambio para confirmar rutas, grupos y estados.
    - Confirmar que todos los grupos cumplen el mínimo definido y documentar cualquier excepción.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, configuration]
