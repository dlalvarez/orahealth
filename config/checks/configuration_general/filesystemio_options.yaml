check_id: filesystemio_options
group_id: configuration_general
title: Filesystem I/O options según estándar
severity: WARNING
collector:
  type: oracle_parameter
  parameter: filesystemio_options
evaluator:
  type: oracle_config
  expected_policy: expected_filesystemio_options
  report_status: INFO
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: filesystemio_options influye en el uso de direct I/O y asynchronous I/O sobre filesystems; un valor no adecuado puede afectar rendimiento o comportamiento de I/O.
  actions:
    - Confirmar si los datafiles están sobre filesystem, ASM u otra capa de almacenamiento.
    - Validar recomendaciones del sistema operativo, versión Oracle y tipo de almacenamiento utilizado.
    - Confirmar soporte y configuración de asynchronous I/O y direct I/O antes de cambiar el parámetro.
    - Evaluar SETALL solamente si aplica al entorno y está soportado por la plataforma.
    - Probar el impacto de I/O en ambiente no productivo o durante una prueba controlada.
    - Cambiar el valor en SPFILE y reiniciar la instancia si corresponde.
    - Validar rendimiento, esperas y errores de I/O después del cambio.
  owner: DBA
  requires_window: true
  outage_risk: medium
tags: [oracle, configuration]
