check_id: archivelog_mode
group_id: configuration_general
title: Base de datos en modo ARCHIVELOG
severity: FAIL
collector:
  type: inventory
  source: database
  field: archivelog_mode
evaluator:
  type: expected_value
  expected: ARCHIVELOG
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: La base de datos no está operando en modo ARCHIVELOG; esto limita la recuperación punto en el tiempo y debilita la estrategia de backup/recovery ante fallas o pérdida de datos.
  actions:
    - Confirmar con el negocio y el equipo DBA los requerimientos de recuperación, RPO y RTO antes de cambiar el modo de log.
    - Validar espacio disponible para archived logs o FRA y definir retención antes de habilitar ARCHIVELOG.
    - Programar una ventana de mantenimiento para cambiar la base de NOARCHIVELOG a ARCHIVELOG siguiendo el procedimiento estándar de la organización.
    - Habilitar ARCHIVELOG de forma controlada y registrar la evidencia del cambio.
    - Ejecutar un backup completo inmediatamente después de habilitar ARCHIVELOG para establecer una nueva línea base recuperable.
    - Validar posteriormente v$database.log_mode y monitorear la generación de archived logs.
  owner: DBA
  requires_window: true
  outage_risk: high
tags: [oracle, backup]
