check_id: database_open_mode
group_id: configuration_general
title: Database open mode is READ WRITE
severity: WARNING
collector:
  type: inventory
  source: database
  field: open_mode
evaluator:
  type: expected_value
  expected: READ WRITE
  failure_status: WARNING
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  database_roles: [PRIMARY]
  requires:
    database_connection: true
remediation:
  summary: El modo de apertura de la base no coincide con el esperado para su rol; esto puede afectar escritura de aplicaciones, recuperación o operación de standby.
  actions:
    - Confirmar el rol de la base de datos y el modo esperado para el ambiente, por ejemplo PRIMARY, STANDBY, READ WRITE o READ ONLY.
    - Revisar si existe una actividad planificada de mantenimiento, switchover, failover o recuperación que justifique el modo actual.
    - Abrir la base en el modo correcto solo después de validar consistencia, rol y dependencias de aplicación.
    - En entornos Data Guard, validar broker, apply/transport lag y procedimientos antes de cambiar el modo de apertura.
    - Confirmar servicios, conectividad y v$database.open_mode después de la acción.
  owner: DBA
  requires_window: true
  outage_risk: medium
tags: [oracle, configuration]
