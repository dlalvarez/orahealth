check_id: compatible
group_id: configuration_general
title: Parámetro compatible definido
severity: WARNING
collector:
  type: oracle_parameter
  parameter: compatible
evaluator:
  type: oracle_config
  report_status_policy: compatible_report_status
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: El parámetro compatible define el nivel de compatibilidad funcional de la base; un valor no alineado puede limitar características disponibles o habilitar comportamientos de versión con impacto operativo.
  actions:
    - Confirmar el valor esperado de compatible según la versión Oracle certificada para la aplicación.
    - Validar la matriz de compatibilidad de aplicación, drivers, clientes, herramientas de respaldo y componentes de integración.
    - No incrementar compatible sin confirmar que no se requiere rollback o downgrade hacia una versión anterior.
    - Si se requiere modificarlo, planificar el cambio bajo control formal porque puede requerir reinicio y tener implicaciones irreversibles.
    - Documentar el valor aprobado como estándar del ambiente y conservar evidencia de la aprobación técnica.
  owner: DBA
  requires_window: true
  outage_risk: high
tags: [oracle, configuration]
