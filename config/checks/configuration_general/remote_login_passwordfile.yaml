check_id: remote_login_passwordfile
group_id: configuration_general
title: Parámetro remote_login_passwordfile según estándar
severity: WARNING
collector:
  type: oracle_parameter
  parameter: remote_login_passwordfile
evaluator:
  type: oracle_config
  expected_policy: expected_remote_login_passwordfile
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: remote_login_passwordfile controla la autenticación remota con privilegios administrativos como SYSDBA; una configuración incorrecta puede afectar seguridad o automatizaciones críticas.
  actions:
    - Validar si se requiere administración remota SYSDBA, Data Guard, RMAN, monitoreo o herramientas externas.
    - Confirmar que el valor configurado cumple el estándar de seguridad del ambiente.
    - Revisar existencia, ubicación, permisos y protección del password file.
    - No cambiar el parámetro sin evaluar impacto en Data Guard, backups, scripts de operación y automatizaciones.
    - Aplicar el cambio en ventana de mantenimiento si requiere reinicio de instancia.
    - Validar conexiones administrativas autorizadas después del cambio y registrar evidencia.
  owner: DBA
  requires_window: true
  outage_risk: medium
tags: [oracle, configuration]
