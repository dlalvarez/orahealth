check_id: audit_trail
group_id: configuration_general
title: Audit trail habilitado según estándar
severity: WARNING
collector:
  type: oracle_parameter
  parameter: audit_trail
evaluator:
  type: oracle_config
  expected_policy: expected_audit_trail
  disallowed_values: [NONE, FALSE]
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: audit_trail controla la auditoría tradicional de Oracle; una configuración no alineada impacta seguridad, cumplimiento, trazabilidad y consumo de almacenamiento.
  actions:
    - Confirmar la política de auditoría de la organización y los requisitos regulatorios aplicables.
    - Validar si la base usa auditoría tradicional, Unified Auditing o una combinación durante transición.
    - Evitar deshabilitar auditoría sin aprobación explícita de seguridad, cumplimiento y dueños de la aplicación.
    - Revisar crecimiento, retención y limpieza de tablas o vistas de auditoría para prevenir consumo excesivo de almacenamiento.
    - Ajustar audit_trail conforme al estándar aprobado y documentar el motivo del valor elegido.
    - Programar reinicio de instancia si el cambio lo requiere y validar generación de registros de auditoría después del cambio.
  owner: DBA
  requires_window: true
  outage_risk: medium
tags: [oracle, configuration]
