check_id: db_block_size
group_id: configuration_general
title: Tamaño de bloque de base de datos según estándar
severity: WARNING
collector:
  type: oracle_parameter
  parameter: db_block_size
evaluator:
  type: oracle_config
  expected_policy: expected_db_block_size
  report_status: INFO
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: db_block_size es una característica estructural de la base de datos; normalmente no se cambia directamente en una base existente sin rediseño o migración controlada.
  actions:
    - Validar que el tamaño de bloque corresponde al estándar de instalación y a los requerimientos de la aplicación.
    - Confirmar si existen tablespaces con tamaños de bloque alternativos y si están justificados operacionalmente.
    - No intentar cambiar db_block_size en una base existente sin diseño, respaldo, pruebas y plan de migración aprobado.
    - Si el valor no cumple el estándar, evaluar recreación o migración controlada de la base, o rediseño de tablespaces específicos cuando aplique.
    - Documentar la excepción si la aplicación, el proveedor o una decisión de arquitectura requiere ese tamaño de bloque.
  owner: DBA
  requires_window: true
  outage_risk: high
tags: [oracle, configuration]
