check_id: redo_log_group_count
group_id: configuration_general
title: Cantidad mínima de grupos redo log
severity: WARNING
collector:
  type: oracle_metric
  field: redo_log_group_count
  label: redo_log_group_count
  source_view: v$log
evaluator:
  type: oracle_config
  label: redo_log_group_count
  minimum_policy: min_redo_log_groups
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: Una cantidad insuficiente de grupos redo puede afectar la continuidad operacional, provocar switches frecuentes y reducir el margen de recuperación ante problemas de escritura o archivado.
  actions:
    - Revisar frecuencia de log switches, tamaño de redo logs y eventos de espera relacionados con redo.
    - Confirmar el mínimo estándar de grupos redo para el ambiente y la carga esperada.
    - Agregar grupos redo adicionales si el conteo está por debajo del mínimo aprobado.
    - No eliminar grupos existentes sin validar estado CURRENT, ACTIVE o INACTIVE y sin un plan seguro de operación.
    - Validar v$log después del cambio para confirmar cantidad, tamaño y estado de los grupos.
    - Monitorear log switches posteriormente para verificar que la configuración es suficiente.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, configuration]
