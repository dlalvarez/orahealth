check_id: remote_login_passwordfile_security
group_id: security
title: Parámetro remote_login_passwordfile seguro
severity: WARNING
collector:
  type: oracle_parameter
  parameter: remote_login_passwordfile
evaluator:
  type: oracle_config
  expected_policy: expected_remote_login_passwordfile
  failure_status: WARNING
  missing_status: ERROR
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: El parámetro remote_login_passwordfile controla autenticación administrativa remota y debe cumplir la política aprobada.
  actions:
    - Revisar si se requiere autenticación administrativa remota con password file.
    - Ajustar el parámetro según el estándar corporativo y la arquitectura Oracle.
    - Validar dependencias de RMAN, RAC, herramientas administrativas o configuraciones con bases standby antes del cambio.
    - Registrar excepciones con justificación y responsable si el valor difiere del estándar.
  owner: DBA
  requires_window: true
  outage_risk: medium
tags: [oracle, seguridad, parametro]
