check_id: unlimited_password_life_profiles
group_id: security
title: Perfiles con password_life_time ilimitado
severity: WARNING
collector:
  type: oracle_security
  field: unlimited_password_life_profiles
  label: Perfiles con vigencia de contraseña ilimitada o heredada como DEFAULT
  source_view: dba_profiles
evaluator:
  type: oracle_security
  label: Perfiles con vigencia de contraseña ilimitada o heredada como DEFAULT
  failure_status: WARNING
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Uno o más perfiles tienen vigencia de contraseña ilimitada o heredada como DEFAULT.
  actions:
    - Definir PASSWORD_LIFE_TIME de acuerdo con la política de seguridad.
    - Coordinar rotación de credenciales técnicas para evitar indisponibilidad.
    - Documentar excepciones para cuentas integradas con bóvedas o autenticación externa.
    - Validar que las aplicaciones actualicen credenciales antes del vencimiento.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, seguridad]
