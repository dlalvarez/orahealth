remediation:
  summary: Existen cuentas bloqueadas; pueden representar intentos fallidos recurrentes, cuentas obsoletas o problemas operativos de acceso.
  actions:
    - Validar si cada cuenta bloqueada sigue siendo necesaria.
    - Investigar bloqueos recientes y origen de intentos fallidos.
    - Mantener bloqueadas las cuentas no utilizadas o default.
    - Desbloquear únicamente cuentas aprobadas por el dueño funcional y ajustar credenciales si aplica.
