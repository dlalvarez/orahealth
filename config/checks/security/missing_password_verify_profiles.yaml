check_id: missing_password_verify_profiles
group_id: security
title: Perfiles sin password_verify_function
severity: WARNING
collector:
  type: oracle_security
  field: missing_password_verify_profiles
  label: Perfiles sin función de verificación de contraseña efectiva
  source_view: dba_profiles
evaluator:
  type: oracle_security
  label: Perfiles sin función de verificación de contraseña efectiva
  failure_status: WARNING
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Uno o más perfiles no tienen función efectiva de verificación de contraseña.
  actions:
    - Configurar PASSWORD_VERIFY_FUNCTION según la política de complejidad aprobada.
    - Validar compatibilidad con cuentas de aplicación y procesos automáticos.
    - Probar creación y cambio de contraseñas en un ambiente controlado.
    - Documentar excepciones temporales con responsable y fecha de caducidad.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, seguridad]
