check_id: dataguard_switchover_readiness_basic
group_id: dataguard
title: Readiness básico de switchover Data Guard
description: Reportar preparación básica de switchover/failover con señales SQL sin recomendar ejecución.
severity: FAIL
collector:
  type: dataguard
  source_view: V$DATABASE/V$DATAGUARD_STATS/V$ARCHIVE_GAP/V$ARCHIVE_DEST_STATUS
  label: Readiness básico de switchover Data Guard
evaluator:
  type: dataguard
  metric: dataguard_switchover_readiness_basic
applicability:
  requires_feature: standby_configuration
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY, MOUNTED]
  requires:
    database_connection: true
remediation:
  summary: Revisar la evidencia Data Guard avanzada únicamente cuando exista configuración standby real.
  actions:
    - Validar primary y standby antes de aplicar cambios.
    - Revisar lag, gaps, destinos remotos y mensajes del alert log en ambos lados.
    - Confirmar servicios, conectividad y aplicación de redo con el procedimiento operativo aprobado.
    - No ejecutar switchover ni failover sin procedimiento aprobado y ventana coordinada.
  owner: Mixed
  requires_window: false
  outage_risk: medium
tags: [oracle, dataguard, standby, feature-aware]
