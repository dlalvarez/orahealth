check_id: recoverability_block_change_tracking
group_id: recoverability_drp
title: Estado de Block Change Tracking
description: Reporta el estado de Block Change Tracking para respaldos incrementales.
severity: INFO
collector:
  type: recoverability_drp
  label: Estado de Block Change Tracking
  source_view: v$block_change_tracking
evaluator:
  type: recoverability_drp
  required: false
  disabled_status: WARNING

applies_to:
  architectures: [standalone, rac]
  open_modes: [READ WRITE]
  requires:
    database_connection: true
remediation:
  summary: Revisar la evidencia de recuperabilidad y preparación DRP para confirmar riesgos de restauración, continuidad o respaldo.
  actions:
    - Validar la evidencia recolectada contra el estándar operativo del ambiente.
    - Confirmar si el hallazgo corresponde a una operación vigente, planificada o a una condición pendiente de corrección.
    - Coordinar acciones con DBA, infraestructura y aplicación antes de modificar parámetros, archivos o políticas de respaldo.
    - Repetir el health check después de la corrección y conservar evidencia del resultado.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, recuperabilidad, drp, respaldos]
