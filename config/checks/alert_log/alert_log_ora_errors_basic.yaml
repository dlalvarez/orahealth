check_id: alert_log_ora_errors_basic
group_id: alert_log
title: Alert log sin errores ORA críticos en la muestra
severity: CRITICAL
collector:
  type: inventory
  source: database
  field: alert_log_excerpt
evaluator:
  type: regex
  pattern: "ORA-(00600|07445)"
  mode: must_not_match
  failure_status: CRITICAL
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: Se detectaron errores ORA relevantes en el alert log; estos eventos pueden indicar fallas internas, problemas de disponibilidad o condiciones que requieren diagnóstico especializado.
  actions:
    - Identificar código ORA, timestamp, frecuencia y componente afectado en alert log y trazas asociadas.
    - Priorizar errores críticos como ORA-00600, ORA-07445, ORA-04031, ORA-01578 u otros relacionados con corrupción, memoria o caída de procesos.
    - Revisar incidentes ADR y archivos de traza antes de reiniciar o limpiar evidencias.
    - Aplicar runbook interno para el error específico y abrir SR con Oracle Support si el código o la recurrencia lo ameritan.
    - Validar si el error impactó sesiones, jobs, backups o procesos de aplicación y documentar la causa raíz.
  owner: DBA
  requires_window: false
  outage_risk: high
tags: [oracle, alert_log]
