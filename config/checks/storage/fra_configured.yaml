check_id: fra_configured
group_id: storage
title: FRA is configured when required
severity: WARNING
collector:
  type: oracle_storage
  source_view: v$recovery_file_dest+v$parameter
evaluator:
  type: storage
  missing_status_policy: fra_not_configured_status
  missing_status: SKIPPED
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: La Fast Recovery Area no está configurada o no tiene tamaño asignado; según el estándar puede ser necesario habilitarla.
  actions:
    - Confirmar si FRA es obligatoria para el ambiente y la estrategia de backups.
    - Definir db_recovery_file_dest en una ubicación con capacidad suficiente.
    - Definir db_recovery_file_dest_size de acuerdo con retención RMAN, archived logs y flashback.
    - Validar integración con RMAN y Data Guard antes de habilitar cambios.
    - Documentar excepción si el ambiente usa una estrategia distinta sin FRA.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, storage, fra]
