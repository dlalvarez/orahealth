check_id: fra_usage
group_id: storage
title: FRA usage percentage
severity: CRITICAL
collector:
  type: oracle_storage
  source_view: v$recovery_file_dest
evaluator:
  type: storage
  warning_policy: max_fra_used_pct_warning
  critical_policy: max_fra_used_pct_critical
  warning: 80
  critical: 95
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  requires:
    database_connection: true
remediation:
  summary: La Fast Recovery Area presenta uso elevado; esto puede bloquear archived logs, backups o recuperación si alcanza su límite.
  actions:
    - Revisar backups, archivelogs y flashback logs.
    - Validar política RMAN de retención.
    - Ejecutar limpieza controlada de backups obsoletos si aplica.
    - Aumentar FRA si el crecimiento es legítimo.
    - No eliminar archivos manualmente fuera de RMAN sin validación.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, storage, fra]
