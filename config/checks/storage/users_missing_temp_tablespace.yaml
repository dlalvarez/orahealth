check_id: users_missing_temp_tablespace
group_id: storage
title: Usuarios sin tablespace temporal válido
description: Detecta usuarios con tablespace temporal nulo, inexistente o inconsistente.
severity: WARNING
collector:
  type: oracle_storage
  field: users_missing_temp_tablespace
  label: Usuarios sin tablespace temporal válido
  source_view: DBA_USERS + DBA_TABLESPACES
evaluator:
  type: storage
  status_when_found: WARNING
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY]
  requires:
    database_connection: true
remediation:
  summary: Asignar un tablespace temporal existente y validar operaciones temporales.
  actions:
    - Revisar la evidencia del check y confirmar si corresponde a objeto o usuario de aplicación.
    - Planificar la corrección en ventana controlada si el cambio puede afectar disponibilidad o DML.
    - Documentar excepciones funcionales justificadas para evitar falsos positivos recurrentes.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, storage]
