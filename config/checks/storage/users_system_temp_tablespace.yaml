check_id: users_system_temp_tablespace
group_id: storage
title: Usuarios con SYSTEM como tablespace temporal
description: Detecta usuarios cuyo tablespace temporal es SYSTEM.
severity: FAIL
collector:
  type: oracle_storage
  field: users_system_temp_tablespace
  label: Usuarios con SYSTEM como tablespace temporal
  source_view: DBA_USERS + DBA_TABLESPACES
evaluator:
  type: storage
  status_when_found: FAIL
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY]
  requires:
    database_connection: true
remediation:
  summary: Crear o identificar un tablespace temporal válido, ejecutar ALTER USER y validar que SYSTEM no se use para operaciones temporales.
  actions:
    - Revisar la evidencia del check y confirmar si corresponde a objeto o usuario de aplicación.
    - Planificar la corrección en ventana controlada si el cambio puede afectar disponibilidad o DML.
    - Documentar excepciones funcionales justificadas para evitar falsos positivos recurrentes.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, storage]
