check_id: tablespace_free_pct
group_id: storage
title: Minimum tablespace free percentage
severity: WARNING
collector:
  type: inventory
  source: database
  field: tablespace_min_free_pct
evaluator:
  type: threshold
  operator: "<="
  warning: 10
  critical: 5
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: El tablespace tiene porcentaje de espacio libre bajo; si no se corrige, puede provocar errores de asignación de segmentos y fallas de aplicación.
  actions:
    - Revisar consumo actual, tendencia de crecimiento y objetos principales del tablespace afectado.
    - Validar autoextend, tamaño máximo de datafiles y capacidad disponible en ASM o filesystem antes de ampliar.
    - Agregar o redimensionar datafiles según el estándar de almacenamiento y la proyección de crecimiento.
    - No eliminar ni mover segmentos sin aprobación del dueño de datos y sin respaldo o plan de reversa.
    - Monitorear el porcentaje libre después de la acción y ajustar alertas preventivas si corresponde.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, storage]
