check_id: datafiles_near_maxsize
group_id: storage
title: Datafiles cercanos al maxsize de autoextend
severity: FAIL
collector:
  type: oracle_storage
  source_view: dba_data_files
evaluator:
  type: storage
  warning_policy: datafile_maxsize_used_pct_warning
  fail_policy: datafile_maxsize_used_pct_fail
  warning: 85
  fail: 95
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Hay datafiles autoextensibles próximos a su MAXSIZE y podrían impedir nuevas asignaciones.
  actions:
    - Revisar datafiles que están próximos a su límite.
    - Aumentar maxsize si hay capacidad y el estándar lo permite.
    - Agregar datafile adicional al tablespace.
    - Validar límites del filesystem, ASM o storage.
    - Monitorear crecimiento después del ajuste.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, storage, datafile]
