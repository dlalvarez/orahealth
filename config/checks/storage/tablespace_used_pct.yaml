check_id: tablespace_used_pct
group_id: storage
title: Porcentaje usado en tablespaces
severity: WARNING
collector:
  type: oracle_storage
  source_view: dba_data_files+dba_free_space
evaluator:
  type: storage
  warning_policy: max_tablespace_used_pct_warning
  fail_policy: max_tablespace_used_pct_fail
  warning: 80
  fail: 90
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY]
  requires:
    database_connection: true
remediation:
  summary: Uno o más tablespaces presentan uso elevado y podrían quedarse sin espacio si continúa el crecimiento.
  actions:
    - Revisar crecimiento del tablespace y objetos principales.
    - Validar espacio disponible en storage, ASM o filesystem.
    - Agregar datafile o redimensionar un datafile existente si aplica.
    - Evaluar autoextend y maxsize.
    - Coordinar ventana si el cambio impacta almacenamiento o requiere control de cambio.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, storage, tablespace]
