check_id: users_system_default_tablespace
group_id: storage
title: Usuarios con SYSTEM como tablespace por defecto
description: Detecta usuarios abiertos de aplicación cuyo tablespace por defecto es SYSTEM.
severity: WARNING
collector:
  type: oracle_storage
  field: users_system_default_tablespace
  label: Usuarios con SYSTEM como tablespace por defecto
  source_view: DBA_USERS + DBA_TABLESPACES
evaluator:
  type: storage
  status_when_found: WARNING
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY]
  requires:
    database_connection: true
remediation:
  summary: Asignar un tablespace de datos adecuado y validar objetos existentes para evitar objetos de aplicación en SYSTEM.
  actions:
    - Revisar la evidencia del check y confirmar si corresponde a objeto o usuario de aplicación.
    - Planificar la corrección en ventana controlada si el cambio puede afectar disponibilidad o DML.
    - Documentar excepciones funcionales justificadas para evitar falsos positivos recurrentes.
  owner: DBA
  requires_window: false
  outage_risk: low
tags: [oracle, storage]
