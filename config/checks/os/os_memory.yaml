check_id: os_memory
group_id: os
title: OS memory information can be collected
severity: INFO
collector:
  type: os_adapter
  method: get_memory_info
evaluator:
  type: regex
  pattern: .+
  mode: must_match
  failure_status: ERROR
applies_to:
  platforms: [linux, aix]
  requires:
    os_connection: true
remediation:
  summary: El servidor no cumple la validación de memoria o no se pudo confirmar correctamente; la presión de memoria puede afectar procesos Oracle y estabilidad del sistema.
  actions:
    - Revisar memoria total, memoria disponible, swap y eventos recientes de OOM o presión de memoria en el sistema operativo.
    - Correlacionar consumo de memoria con SGA, PGA, procesos Oracle y cargas de aplicación.
    - Validar que los comandos del adaptador OS tengan permisos suficientes para reportar memoria de forma confiable.
    - Ajustar parámetros de memoria o capacidad del host solo después de analizar tendencia y requerimientos de workload.
    - Monitorear memoria y swap después de cualquier cambio para confirmar estabilidad.
  owner: OS
  requires_window: false
  outage_risk: medium
tags: [os, memory]
