check_id: patching_registry_sqlpatch_errors
group_id: patching
title: Errores en SQL patch registry
description: Validación SQL-first de readiness de patching de base de datos Oracle. No aplica parches, no compara ambientes y no usa fuentes licenciadas.
severity: FAIL
collector:
  type: patching
  source_view: DBA_REGISTRY_SQLPATCH
  label: Errores en SQL patch registry
evaluator:
  type: patching
  metric: patching_registry_sqlpatch_errors
applies_to:
  architectures: [standalone, rac, dataguard, rac_dataguard]
  open_modes: [READ WRITE, READ ONLY, READ ONLY WITH APPLY, MOUNTED]
  requires:
    database_connection: true
remediation:
  summary: Revisar la evidencia de patching con el equipo DBA antes de una ventana aprobada.
  actions:
    - Revisar las vistas de registry y SQL patch correspondientes al hallazgo.
    - Confirmar el último ciclo de patching con el equipo DBA responsable.
    - Validar componentes u objetos inválidos antes de la ventana y documentar excepciones.
    - Ejecutar acciones correctivas solo bajo procedimiento oficial, ventana aprobada y respaldo o rollback definido.
  owner: DBA
  requires_window: false
  outage_risk: medium
tags: [oracle, patching, readiness, sql-first]
