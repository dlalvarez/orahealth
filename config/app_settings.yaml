app:
  name: OraHealthCheck
  default_output_dir: output
  timezone: America/Bogota
  log_level: INFO
  mask_secrets_in_logs: true
  max_parallel_checks: 5
  default_command_timeout_seconds: 60
  default_sql_timeout_seconds: 60
  # Porcentaje mínimo de validaciones aplicables que deben evaluarse con evidencia
  # confiable. Por debajo, el estado global es ERROR (evaluación no concluyente).
  min_evidence_coverage_pct: 80
reports:
  generate_executive: true
  generate_technical: true
  generate_corrective_actions: true
  include_sql_text: false
  include_command_text: true
  include_raw_evidence: true
  theme: light
security:
  allow_passwords_in_files: true
  mask_passwords_in_output: true
